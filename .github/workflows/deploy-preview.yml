name: Deploy to GitHub Pages (production — ehleague.org)

# The newsletter app has moved to news.ehleague.org, so this site no longer
# shares a host with it — GitHub Pages, via the ehleague.org/www.ehleague.org
# custom domain, is now the real production target. Builds WITHOUT
# BUILD_TARGET=gh-pages so it gets the root-relative production config
# (base: '/', site: https://ehleague.org) — the old /ehl_website subpath
# build is only for the default halliday2026.github.io/ehl_website/ URL,
# which is no longer what's wired to the custom domain. See deploy.yml for
# the (now likely obsolete) Hostway FTPS path.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-preview
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # package.json requires >=22.12.0 (Astro 7)
          cache: npm

      - run: npm ci

      - name: Build (production config — served at the ehleague.org root)
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - id: deployment
        uses: actions/deploy-pages@v4
